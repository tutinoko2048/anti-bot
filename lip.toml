format = 4
id = "github.com/tutinoko2048/anti-bot"
version = "0.1.0"

[info]
name = "Anti Bot"
description = "Kicks spam bots that chat or run commands without finishing the join (host side, LeviLamina Client)"
tags = []

[[variants.""]]
side = "client"
platform = "win-x64"

[variants."".deps]
# The bare id, not "#client": a lip.toml dependency is never rewritten, and lip.toml releases of
# LeviLamina have no "client" variant. The range starts above 26.60.6, the last tooth.json release,
# because the "" variant of a tooth.json release is the server build.
"github.com/LiteLDev/LeviLamina" = ">26.60.6 <26.61.0"

[[variants."".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/anti-bot-client-windows-x64.zip"]
place = [{ src = "anti-bot/", dest = "mods/anti-bot/" }]
