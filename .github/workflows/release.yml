name: Release

# Publish a GitHub release with a tag like v0.2.0; this builds it and attaches
#   anti-bot-client-windows-x64.zip  (anti-bot/anti-bot.dll + manifest.json, the layout lip.toml expects)
#   anti-bot-client-windows-x64.pdb.zip  (symbols, only needed to read crash addresses)
on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - name: Mod version from the tag (v0.2.0 -> 0.2.0)
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          "MOD_VERSION=$($env:TAG -replace '^v','')" >> $env:GITHUB_ENV

      - run: xmake repo -u

      - run: xmake f -a x64 -m release -p windows --target_type=client -y

      - run: xmake -w -y

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/anti-bot | Out-Null
          Copy-Item bin/anti-bot/anti-bot.dll, bin/anti-bot/manifest.json dist/anti-bot/
          Compress-Archive -Path dist/anti-bot -DestinationPath anti-bot-client-windows-x64.zip
          Compress-Archive -Path bin/anti-bot/anti-bot.pdb -DestinationPath anti-bot-client-windows-x64.pdb.zip

      - name: Upload to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            anti-bot-client-windows-x64.zip anti-bot-client-windows-x64.pdb.zip --clobber
